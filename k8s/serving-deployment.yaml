apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serving
  namespace: ml-training
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: model-serving
  template:
    metadata:
      labels:
        app: model-serving
    spec:
      containers:
        - name: api
          image: mlops-serve:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            initialDelaySeconds: 15
          volumeMounts:
            - name: checkpoints
              mountPath: /app/checkpoints
              readOnly: true
      volumes:
        - name: checkpoints
          persistentVolumeClaim:
            claimName: mlops-checkpoints-pvc
